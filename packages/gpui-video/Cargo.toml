[package]
name = "gpui-video"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "可复用的 GPUI 视频播放器组件（controller + 渲染 + 控制条）"

[dependencies]
# 同 workspace：媒体内核（FFmpeg 解码/时钟/seek）。
player-core = { path = "../player-core" }

# 跨仓库：gpui_learn 的自研控件库（进度条/按钮），与 aa-player 同源 gpui。
# 走 GitHub git 源（锁到具体 commit，保证可复现；改 ui-gpui 后需先 push
# gpui_learn 再更新此 rev）。
ui-gpui = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "e5fb06e" }

# 跨仓库：gpui_learn 的资产嵌入 crate（AssetSource），供 svg().path("icons/…")
# 内嵌加载图标（对齐 zed/gpui-component，而非运行时磁盘路径）。
assets = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "e5fb06e" }

gpui = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# 用于识别可恢复的解码错误（坏帧跳过）；player-core 已传递依赖，不额外编译。
ffmpeg-next = "8"

# 解码帧 → RenderImage 转换，与 player-app 相同的 image/smallvec 版本。
image = "0.25"
smallvec = "1"

# 异步通道：解码线程(Sender) → GPUI 渲染 task(async recv)。
futures = "0.3"

[dev-dependencies]
env_logger = "0.11"
# example 用 asset source 加载图标/字体。
assets = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "e5fb06e" }
# 桌面窗口后端（example 用 application() 入口）。
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dev-dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
gpui_platform = { workspace = true }
wasm-bindgen = "0.2.120"
