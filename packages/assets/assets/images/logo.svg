<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 模拟吉卜力水彩边缘晕染和手绘毛边滤镜 -->
    <filter id="watercolor-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 吉卜力清新梦幻的渐变色 -->
    <linearGradient id="ghibliBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 水彩晕染的高光阴影 -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 外层水彩淡淡的晕染底色（营造手绘扩散感） -->
  <path d="M 125 105 Q 260 70 385 120 Q 450 250 395 385 Q 250 450 120 395 Q 60 260 125 105 Z"
        fill="#93C5FD" opacity="0.25" filter="url(#watercolor-edge)"/>

  <!-- 主体：可爱的圆角三角形播放按钮 -->
  <path d="M 152 120 C 152 95, 185 78, 208 92 L 390 205 C 412 219, 412 253, 390 267 L 208 380 C 185 394, 152 377, 152 352 Z"
        fill="url(#ghibliBlue)"
        filter="url(#watercolor-edge)"
        stroke="#1E3A8A"
        stroke-width="3"
        stroke-linejoin="round"
        opacity="0.95"/>

  <!-- 内部光泽/水彩渐变高光 -->
  <path d="M 175 140 C 175 130, 195 115, 215 125 L 350 210 C 365 220, 365 235, 350 245 L 215 245 C 190 245, 175 210, 175 180 Z"
        fill="url(#innerGlow)"/>

  <!-- 可爱的大眼睛与微笑表情组 -->
  <g transform="translate(15, 10)">
    <!-- 左眼 -->
    <circle cx="230" cy="225" r="9" fill="#1E3A8A"/>
    <circle cx="227" cy="222" r="3" fill="#FFFFFF"/> <!-- 高光 -->

    <!-- 右眼 -->
    <circle cx="282" cy="225" r="9" fill="#1E3A8A"/>
    <circle cx="279" cy="222" r="3" fill="#FFFFFF"/> <!-- 高光 -->

    <!-- 害羞的粉红腮红 -->
    <circle cx="213" cy="240" r="10" fill="#F43F5E" opacity="0.35"/>
    <circle cx="299" cy="240" r="10" fill="#F43F5E" opacity="0.35"/>

    <!-- 可爱的微笑嘴巴 -->
    <path d="M 248 238 Q 256 247, 264 238"
          fill="none"
          stroke="#1E3A8A"
          stroke-width="3.5"
          stroke-linecap="round"/>
  </g>
</svg>
