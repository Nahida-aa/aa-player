[package]
name = "aa-player"
description = "aa-player 的 GPUI 图形界面应用"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# 复用自包含播放器组件（内含解码线程/音频时钟/画面/控制条/统计）。
gpui-video = { path = "../gpui-video" }
# 内嵌资源：图标(svg)与字体，供组件与文本渲染使用。同源本地 crate。
assets = { path = "../assets" }
# 复用 ui-gpui 的 Icon 控件与图标资源（组合进 with_assets 的 AssetSource）。
ui-gpui = { git = "https://github.com/Nahida-aa/gpui_learn", rev = "421553b" }

gpui.workspace = true

# app 是二进制入口，负责初始化订阅者（决定日志去哪、什么级别）。
tracing.workspace = true
tracing-subscriber.workspace = true

# 命令行参数解析（视频路径）。用 derive + 最小 feature，只为单个可选参数。
clap = { version = "4", features = ["derive"] }

# 系统文件选择器（无参打开时点击选择视频）。开 OS 原生对话框。
rfd = "0.15"

# 解码 PNG 设为窗口图标（X11）。版本须与 gpui 内部 image 一致（0.25），
# 否则 WindowOptions.icon 的 RgbaImage 类型不匹配无法编译。
image = "0.25"

# Windows 下把图标/版本信息嵌进 exe（资源管理器/任务栏/快捷方式用）。
# 不能按 target 门控：build.rs 里引用的 crate 必须始终可解析；
# 该 crate 纯 Rust 且只在目标是 Windows 时才被调用，无平台负担。
[build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { workspace = true }
wasm-bindgen = "0.2.120"
